<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <!-- Ana ekrana eklenince uygulama gibi acilsin -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#060a11">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Traxplore">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Traxplore</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/globe.gl@2.46.2/dist/globe.gl.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="style.css?v=20260908c">
</head>
<body>
    <!-- Giriş / Kayıt ekranı -->
<div id="girisEkran" class="giris-ekran">
    <div class="giris-kutu">
        <h1 class="giris-logo">TRAXPLORE</h1>
        <p id="girisMesaj" class="giris-mesaj"></p>
        <input type="email" id="girisEmail" placeholder="E-posta" />
        <input type="password" id="girisSifre" placeholder="Şifre" />
        <input type="text" id="girisKullanici" placeholder="Kullanıcı adı" maxlength="20"
               autocomplete="off" autocapitalize="none" spellcheck="false" />
        <button id="girisBtn" class="giris-btn">Giriş Yap</button>
        <button id="kayitBtn" class="kayit-btn">Kayıt Ol</button>
        <button id="modDegistir" class="metin-btn">Hesabın yok mu? Kayıt ol</button>
        <button id="sifreUnuttum" class="metin-btn">Şifremi unuttum</button>
        <div id="adSecimAlani">
            <input type="text" id="adSecimGiris" placeholder="kullanıcı adı" maxlength="20"
                   autocomplete="off" autocapitalize="none" spellcheck="false" />
            <button id="adSecimKaydet" class="giris-btn">Kullanıcı Adını Al</button>
        </div>
        <div id="yeniSifreAlani">
            <input type="password" id="yeniSifre" placeholder="Yeni şifre (en az 6 karakter)" />
            <button id="yeniSifreKaydet" class="giris-btn">Şifreyi Değiştir</button>
        </div>
    </div>
</div>

<!-- Canlı arama -->
<div id="aramaKutu" class="arama-kutu">
    <input type="text" id="aramaInput" placeholder="Şehir veya ülke ara..." autocomplete="off" />
    <div id="aramaSonuc" class="arama-sonuc"></div>
</div>
<!-- Çıkış butonu -->
<button id="cikisBtn" class="cikis-btn">Çıkış</button>
    <div id="crosshairY"></div>
    <div id="crosshairX"></div>

    <!-- Mobil şeritler. Masaüstünde gizli, dar ekranda görünür. -->
    <div id="mobilUst">
        <span id="mobilLogo">TRAXPLORE</span>
        <span id="mobilSayac">0 ülke · 0 şehir</span>
    </div>
    <nav id="mobilAlt">
        <button id="mobilAra" data-bolum="aramaKutu">Ara</button>
        <button id="mobilProfil" data-bolum="profilKart">Profil</button>
        <button id="mobilGecmis" data-bolum="gecmisPanel">Son Gezdiklerin</button>
        <button id="mobilIstatistik" data-bolum="istatistikPanel">İstatistikler</button>
    </nav>
    <div id="istatistik">0 ÜLKE — 0 ŞEHİR GEZDİN</div>
    <div id="harita"></div>
    <div id="kitaChart">
        <div id="koordinat">— , —</div>
        <svg id="kitaSvg" viewBox="0 0 200 200"></svg>
        <div id="kitaLejant"></div>
    </div>
    <div id="istatistikPanel">
        <button id="istatistikKapat">×</button>
        <h2 id="istatistikBaslik">Kıta İstatistikleri</h2>
        <div id="kitaBarListe"></div>
    </div>
    <div id="ortu"></div>
    <div id="panel">
        <button id="kapat">×</button>
        <h2 id="panelBaslik"></h2>
        <p id="panelAltBaslik">Hangi şehirlere gittin?</p>
        <div id="sehirListe"></div>
    </div>
    <div id="sehirDetayPanel">
        <button id="sehirDetayKapat">×</button>
        <h2 id="sehirDetayBaslik"></h2>
        <img id="sehirKapak" src="" alt="">

        <div id="kilitUyari">Bu şehri değerlendirmek için önce <b>gittim</b> olarak işaretle.</div>

        <div id="detayGovde">
        <div class="detay-bolum">
            <label>PUANIN</label>
            <div id="yildizlar">
                <span class="yildiz" data-puan="1">★</span>
                <span class="yildiz" data-puan="2">★</span>
                <span class="yildiz" data-puan="3">★</span>
                <span class="yildiz" data-puan="4">★</span>
                <span class="yildiz" data-puan="5">★</span>
            </div>
        </div>

        <div class="detay-bolum">
            <label>NE ZAMAN GİTTİN?</label>
            <div class="tarih-satir">
                <select id="sehirAy"></select>
                <select id="sehirYil"></select>
                <button id="sehirTarihTemizle" class="metin-btn">temizle</button>
            </div>
            <div class="tarih-not">İstersen boş bırakabilirsin.</div>
        </div>

        <div class="detay-bolum">
            <label>FOTOĞRAF</label>
            <input type="file" id="sehirFotoInput" accept="image/*" hidden>
            <label for="sehirFotoInput" id="sehirFotoLabel">+ Fotoğraf Ekle</label>
            <div id="sehirFotoOnizle"></div>
        </div>

        <div class="detay-bolum">
            <label>NOTUN</label>
            <textarea id="sehirNot" placeholder="Bu şehirle ilgili notların..."></textarea>
        </div>

        <button id="sehirDetayKaydet">KAYDET</button>
    </div>
</div>
<div id="logo">TRAXPLORE</div>
<button id="profilBtn">
    <span id="profilFoto"></span>
    <span id="profilCizgi"></span>
    <span id="profilYazi">PROFİL</span>
</button>
    <div id="gecmisPanel">
        <button id="gecmisKapat">&times;</button>
        <h3 id="gecmisBaslik">Son Gezdiklerin</h3>
        <div id="gecmisListe"></div>
    </div>
    <div id="profilKart">
        <button id="profilKapat">×</button>

        <div id="profilFotolar">
            <input type="file" id="profilFotoInput" accept="image/*" hidden>
            <div id="profilAvatar" class="avatar avatar-buyuk"></div>
            <div id="profilFotoIsler">
                <label for="profilFotoInput" id="profilFotoEkle">Fotoğraf Seç</label>
                <button id="profilFotoKaldir" class="metin-btn">Kaldır</button>
            </div>
            <div id="profilFotoDurum"></div>
        </div>

        <div class="profil-bolum">
            <label>İSİM</label>
            <input type="text" id="profilIsim" placeholder="Adın" disabled>
        </div>

        <div class="profil-bolum" id="gizlilikBolum">
            <label>PROFİL GÖRÜNÜRLÜĞÜ</label>
            <label class="anahtar-satir">
                <input type="checkbox" id="profilAcikAnahtar">
                <span class="anahtar-gorsel"></span>
                <span class="anahtar-yazi">
                    <b id="profilAcikBaslik">Herkese açık</b>
                    <em id="profilAcikNot">Haritanı ve fotoğraflarını herkes görebilir.</em>
                </span>
            </label>
        </div>

        <div class="profil-bolum">
            <label>KONUM</label>
            <input type="text" id="profilKonum" placeholder="Şehir, Ülke" disabled>
        </div>

        <div class="profil-bolum" id="hareketBolum">
            <label>GEZİ KAYDI</label>
            <label class="anahtar-satir">
                <input type="checkbox" id="hareketAnahtar">
                <span class="anahtar-gorsel"></span>
                <span class="anahtar-yazi">
                    <b id="hareketBaslik">Kapalı</b>
                    <em id="hareketNot">Gezi kaydını kimse göremez.</em>
                </span>
            </label>
        </div>

        <div class="profil-bolum">
            <label>GEZİ KAYDIN</label>
            <div id="profilSonGezilen"></div>
        </div>

        <div id="profilButonlar">
            <button id="profilKaydet">KAYDET</button>
            <button id="profilDegistir">DEĞİŞTİR</button>
        </div>
        <div id="profilAyarlar">
            <button id="profilCikis" class="profil-ayar-btn">Çıkış Yap</button>
            <button id="profilSifirla" class="profil-ayar-btn tehlike">Haritayı Sıfırla</button>
        </div>
    </div>
    <button id="sifirlaBtn">HARİTAYI SIFIRLA</button>

    <!-- iPhone'da "ana ekrana ekle" adimini kimse kendiliginden bulmuyor -->
    <div id="ekleIpucu">
        <span>Uygulama gibi kullanmak için: paylaş <b>&#8593;</b> → <b>Ana Ekrana Ekle</b></span>
        <button id="ipucuKapat">&times;</button>
    </div>

    <script src="script.js?v=20260908c"></script>
    <script>
    /* Servis iscisi: uygulamanin kabugunu telefonda tutuyor, acilis
       hizlaniyor. Sadece https'te calisiyor, yerel testte kaydolmuyor. */
    if ("serviceWorker" in navigator && location.protocol === "https:") {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("sw.js").catch(function (e) {
          console.log("Servis iscisi kaydedilemedi:", e.message);
        });
      });
    }

    /* iOS'ta tarayici "yukle" diye sormuyor, kullanicinin paylas
       menusunden eklemesi gerekiyor. Bir kez soyluyoruz, kapatinca
       bir daha cikmiyor. */
    (function ekleIpucu() {
      const el = document.getElementById("ekleIpucu");
      if (!el) return;
      const iOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
      const uygulamada = window.navigator.standalone === true ||
                         window.matchMedia("(display-mode: standalone)").matches;
      let gizli = false;
      try { gizli = localStorage.getItem("ipucuKapali") === "1"; } catch (e) {}
      if (iOS && !uygulamada && !gizli) el.classList.add("acik");
      document.getElementById("ipucuKapat").addEventListener("click", function () {
        el.classList.remove("acik");
        try { localStorage.setItem("ipucuKapali", "1"); } catch (e) {}
      });
    })();
    </script>
</body>
</html>
