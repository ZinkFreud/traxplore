<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traxplore</title>
    <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="crosshairY"></div>
    <div id="crosshairX"></div>
    <div id="istatistik">0 ÜLKE — 0 ŞEHİR GEZDİN</div>
    <div id="harita"></div>
    <div id="kitaChart">
        <div id="koordinat">— , —</div>
        <svg id="kitaSvg" viewBox="0 0 200 200"></svg>
        <div id="kitaLejant"></div>
    </div>
    <div id="istatistikPanel">
        <button id="istatistikKapat">×</button>
        <h2 id="istatistikBaslik">Kıta İstatistikleri</h2>
        <div id="kitaBarListe"></div>
    </div>
    <div id="ortu"></div>
    <div id="panel">
        <button id="kapat">×</button>
        <h2 id="panelBaslik"></h2>
        <p id="panelAltBaslik">Hangi şehirlere gittin?</p>
        <div id="sehirListe"></div>
    </div>
    <div id="sehirDetayPanel">
        <button id="sehirDetayKapat">×</button>
        <h2 id="sehirDetayBaslik"></h2>
        <img id="sehirKapak" src="" alt="">

        <div class="detay-bolum">
            <label>PUANIN</label>
            <div id="yildizlar">
                <span class="yildiz" data-puan="1">★</span>
                <span class="yildiz" data-puan="2">★</span>
                <span class="yildiz" data-puan="3">★</span>
                <span class="yildiz" data-puan="4">★</span>
                <span class="yildiz" data-puan="5">★</span>
            </div>
        </div>

        <div class="detay-bolum">
            <label>FOTOĞRAF</label>
            <input type="file" id="sehirFotoInput" accept="image/*" hidden>
            <label for="sehirFotoInput" id="sehirFotoLabel">+ Fotoğraf Ekle</label>
            <div id="sehirFotoOnizle"></div>
        </div>

        <div class="detay-bolum">
            <label>NOTUN</label>
            <textarea id="sehirNot" placeholder="Bu şehirle ilgili notların..."></textarea>
        </div>

        <button id="sehirDetayKaydet">KAYDET</button>
    </div>
    <div id="logo">TRAXPLORE</div>
    <div id="gecmisPanel">
        <h3 id="gecmisBaslik">Son Gezdiklerin</h3>
        <div id="gecmisListe"></div>
    </div>
    <button id="sifirlaBtn">HARİTAYI SIFIRLA</button>

    <script src="script.js"></script>
</body>
</html>
